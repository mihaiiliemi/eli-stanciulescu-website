<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Monogram SE - S exterior, E interior, stil sigiliu circular -->

  <!-- S - curba exterioara mare, inconjoara E-ul -->
