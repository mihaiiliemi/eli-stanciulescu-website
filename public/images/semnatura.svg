           C 75 14, 88 22, 88 35
           C 88 46, 78 52, 68 54
           C 58 56, 48 60, 46 70
           C 44 80, 52 90, 65 90
           C 75 90, 85 84, 86 76"
    stroke="#C4621A" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.95"/>

  <!-- S - continuare curba superioara -->
  <path d="M 62 18
           C 52 15, 38 18, 32 28
           C 26 38, 32 48, 42 52"
    stroke="#C4621A" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.95"/>

  <!-- E - verticala -->
  <path d="M 42 30 C 41 44, 40 58, 41 74"
    stroke="#C4621A" stroke-width="2.8" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- E - bara sus -->
  <path d="M 41 31 C 50 29, 60 30, 67 31"
    stroke="#C4621A" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- E - bara mijloc -->
  <path d="M 41 52 C 49 51, 57 51, 63 52"
    stroke="#C4621A" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- E - bara jos -->
  <path d="M 41 73 C 50 75, 60 74, 67 73"
    stroke="#C4621A" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85"/>
</svg>
