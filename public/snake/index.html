<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cerneală</title>
<style>
  /* ============================================================
     STIL GENERAL: tema "cerneală pe hârtie"
     Fond crem de hârtie, cerneală indigo, sigiliu roșu de ceară.
     ============================================================ */
  :root {
    --paper: #f3ecdc;
    --paper-dark: #e6dcc4;
    --ink: #1f2a5a;
    --ink-light: #4a5a9a;
    --wax: #b4322e;
    --text: #2a2a2a;
    --muted: #7a7260;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--paper);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    overflow: hidden;
    touch-action: none;           /* blochează scroll/zoom la swipe pe mobil */
    user-select: none; -webkit-user-select: none;
  }
  #app {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* Bara de sus: scor, record, mute */
  #hud {
    width: min(100vw, calc(100vh - 90px), 640px);
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 6px;
    font-size: 17px;
    letter-spacing: 0.02em;
  }
  #hud .val { font-weight: bold; color: var(--ink); font-variant-numeric: tabular-nums; }
  #hud .lbl { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.12em; }
  #mute {
    background: transparent; border: 1px solid var(--muted); color: var(--ink);
    border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px;
    cursor: pointer;
  }
  #mute.off { opacity: 0.5; text-decoration: line-through; }
  /* Canvas pătrat, scalat la lățimea ecranului */
  #wrap { position: relative; width: min(100vw, calc(100vh - 90px), 640px); aspect-ratio: 1 / 1; }
  canvas {
    display: block; width: 100%; height: 100%;
    border-radius: 6px;
    box-shadow: 0 2px 0 var(--paper-dark), 0 12px 30px rgba(40,30,10,0.12);
  }
  #hint {
    color: var(--muted); font-size: 14px; margin-top: 12px; text-align: center;
    min-height: 1.2em;
  }
  /* Ecran de final, peste canvas */
  #over {
    position: absolute; inset: 0;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(243,236,220,0.88);
    border-radius: 6px; text-align: center;
    animation: fade 120ms ease-out;
  }
  #over.show { display: flex; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  #over h1 { margin: 0 0 6px; font-size: 22px; font-weight: normal; color: var(--ink); letter-spacing: 0.06em; }
  #over .big { font-size: 56px; color: var(--ink); line-height: 1; margin: 6px 0; }
  #over .rec { color: var(--muted); font-size: 15px; margin-bottom: 4px; }
  #over .new { color: var(--wax); font-size: 17px; font-weight: bold; margin: 8px 0 0; min-height: 1.3em; }
  #again {
    margin-top: 22px; padding: 16px 44px;
    background: var(--ink); color: var(--paper);
    border: none; border-radius: 999px;
    font: inherit; font-size: 20px; letter-spacing: 0.04em;
    cursor: pointer;
  }
  #again:active { transform: scale(0.97); }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div><span class="lbl">Scor</span><br><span class="val" id="score">0</span></div>
    <button id="mute" type="button" aria-label="Sunet">sunet</button>
    <div style="text-align:right"><span class="lbl">Record</span><br><span class="val" id="best">0</span></div>
  </div>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="over">
      <h1>S-a rupt linia</h1>
      <div class="big" id="finalScore">0</div>
      <div class="rec">record: <span id="finalBest">0</span></div>
      <div class="new" id="newRecord"></div>
      <button id="again" type="button">Din nou</button>
    </div>
  </div>
  <div id="hint">săgeți, WASD sau swipe ca să pornești</div>
</div>

<script>
(function () {
'use strict';

/* ============================================================
   CONFIG: toate valorile ajustabile
   ============================================================ */
const CONFIG = {
  grid: 20,               // celule pe latură (grilă pătrată)
  startLength: 3,         // segmente la start
  startTickMs: 160,       // ms între mișcări la start (mai mic = mai rapid)
  speedUpPerFood: 0.03,   // +3% viteză la fiecare mâncare
  maxSpeedMult: 2.5,      // plafon: de 2,5x viteza inițială
  pointsPerFood: 10,      // puncte pe mâncare
  restartDelayMs: 350,    // cât timp e blocată repornirea după pierdere (sub 1s)
  swipeMinPx: 24,         // distanța minimă ca un swipe să conteze
  pulseMs: 180,           // durata pulsului vizual la mâncare
  storageKey: 'cerneala-snake-record',
  colors: {
    paper: '#f3ecdc',
    gridLine: 'rgba(31,42,90,0.08)',
    body: '#2c3a78',
    bodyTail: '#6b78b8',
    head: '#141c40',
    eye: '#f3ecdc',
    food: '#b4322e',
    foodHighlight: '#e0655f'
  }
};

/* ============================================================
   STARE: tot ce se schimbă în timpul jocului
   ============================================================ */
const state = {
  snake: [],          // [{x,y}], index 0 = cap
  dir: { x: 1, y: 0 },        // direcția aplicată la următorul tic
  nextDir: null,      // direcția cerută de jucător (validată la tic)
  dirQueue: [],       // coadă de intrări, ca două apăsări rapide să nu se piardă
  food: { x: 0, y: 0 },
  score: 0,
  best: 0,
  tickMs: CONFIG.startTickMs,
  running: false,     // șarpele se mișcă
  over: false,        // ecran de final activ
  overAt: 0,          // timestamp-ul pierderii, pentru blocajul scurt de repornire
  lastTick: 0,        // acumulator de timp pentru ticuri fixe
  pulseUntil: 0,      // până când desenăm pulsul
  muted: false
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const elScore = document.getElementById('score');
const elBest = document.getElementById('best');
const elOver = document.getElementById('over');
const elFinalScore = document.getElementById('finalScore');
const elFinalBest = document.getElementById('finalBest');
const elNewRecord = document.getElementById('newRecord');
const elAgain = document.getElementById('again');
const elMute = document.getElementById('mute');
const elHint = document.getElementById('hint');

/* ============================================================
   RECORD: salvare locală în browser
   ============================================================ */
function loadBest() {
  try { return parseInt(localStorage.getItem(CONFIG.storageKey) || '0', 10) || 0; }
  catch (e) { return 0; }
}
function saveBest(v) {
  try { localStorage.setItem(CONFIG.storageKey, String(v)); } catch (e) { /* mod privat etc. */ }
}
function loadMuted() {
  try { return localStorage.getItem(CONFIG.storageKey + '-mute') === '1'; } catch (e) { return false; }
}

/* ============================================================
   SUNET: generat în cod cu Web Audio, fără fișiere
   ============================================================ */
let audioCtx = null;
function ensureAudio() {
  if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { audioCtx = new AC(); } catch (e) { audioCtx = null; }
}
function beep(freq, durMs, type) {
  if (state.muted || !audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type || 'triangle';
  o.frequency.value = freq;
  const t = audioCtx.currentTime;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.18, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + durMs / 1000);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + durMs / 1000 + 0.02);
}
function soundEat()  { beep(660, 90, 'triangle'); setTimeout(() => beep(880, 70, 'triangle'), 60); }
function soundOver() { beep(220, 180, 'sawtooth'); setTimeout(() => beep(150, 260, 'sawtooth'), 120); }

/* ============================================================
   REGULI: inițializare, mâncare, mișcare, coliziuni
   ============================================================ */
function resetGame() {
  const c = Math.floor(CONFIG.grid / 2);
  state.snake = [];
  // capul în centru, corpul se întinde spre stânga; se mișcă spre dreapta
  for (let i = 0; i < CONFIG.startLength; i++) state.snake.push({ x: c - i, y: c });
  state.dir = { x: 1, y: 0 };
  state.nextDir = null;
  state.dirQueue = [];
  state.score = 0;
  state.tickMs = CONFIG.startTickMs;
  state.running = false;
  state.over = false;
  state.lastTick = 0;
  state.pulseUntil = 0;
  placeFood();
  updateHud();
  elOver.classList.remove('show');
  elHint.textContent = 'săgeți, WASD sau swipe ca să pornești';
}

// Mâncarea apare doar pe o celulă liberă (niciodată pe corp)
function placeFood() {
  const occupied = new Set(state.snake.map(s => s.x + ',' + s.y));
  const free = [];
  for (let y = 0; y < CONFIG.grid; y++)
    for (let x = 0; x < CONFIG.grid; x++)
      if (!occupied.has(x + ',' + y)) free.push({ x, y });
  if (free.length === 0) { state.food = { x: -1, y: -1 }; return; } // grila plină: șarpele a câștigat tot
  state.food = free[Math.floor(Math.random() * free.length)];
}

// Un tic = o mișcare cu o celulă
function tick() {
  // aplică prima direcție validă din coadă (fără întoarcere la 180°)
  while (state.dirQueue.length) {
    const d = state.dirQueue.shift();
    if (d.x === -state.dir.x && d.y === -state.dir.y) continue; // opus: ignorat
    if (d.x === state.dir.x && d.y === state.dir.y) continue;   // aceeași: nimic
    state.dir = d; break;
  }

  const head = state.snake[0];
  const nx = head.x + state.dir.x;
  const ny = head.y + state.dir.y;

  // perete
  if (nx < 0 || ny < 0 || nx >= CONFIG.grid || ny >= CONFIG.grid) { gameOver(); return; }

  const eats = (nx === state.food.x && ny === state.food.y);

  // coliziune cu corpul: coada se mută în același tic (dacă nu mănâncă),
  // deci ultimul segment NU contează. Dacă mănâncă, coada rămâne și contează.
  const limit = eats ? state.snake.length : state.snake.length - 1;
  for (let i = 0; i < limit; i++) {
    if (state.snake[i].x === nx && state.snake[i].y === ny) { gameOver(); return; }
  }

  state.snake.unshift({ x: nx, y: ny });
  if (eats) {
    state.score += CONFIG.pointsPerFood;
    // viteză +3%, plafonată la 2,5x
    const minTick = CONFIG.startTickMs / CONFIG.maxSpeedMult;
    state.tickMs = Math.max(minTick, state.tickMs / (1 + CONFIG.speedUpPerFood));
    state.pulseUntil = performance.now() + CONFIG.pulseMs;
    soundEat();
    placeFood();
    updateHud();
  } else {
    state.snake.pop();
  }
}

function gameOver() {
  state.running = false;
  state.over = true;
  state.overAt = performance.now();
  soundOver();
  const isNew = state.score > state.best && state.score > 0;
  if (isNew) { state.best = state.score; saveBest(state.best); }
  elFinalScore.textContent = state.score;
  elFinalBest.textContent = state.best;
  elNewRecord.textContent = isNew ? 'Record nou' : '';
  updateHud();
  elOver.classList.add('show');
  elHint.textContent = 'tastă sau tap oriunde pentru rundă nouă';
}

function updateHud() {
  elScore.textContent = state.score;
  elBest.textContent = state.best;
}

/* ============================================================
   CONTROL: tastatură (săgeți, WASD), swipe, tap, repornire
   ============================================================ */
const KEYS = {
  ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 }, ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
  w: { x: 0, y: -1 }, s: { x: 0, y: 1 }, a: { x: -1, y: 0 }, d: { x: 1, y: 0 },
  W: { x: 0, y: -1 }, S: { x: 0, y: 1 }, A: { x: -1, y: 0 }, D: { x: 1, y: 0 }
};

// Orice intrare a jucătorului trece pe aici.
// dir = null înseamnă tap / tastă fără direcție (folosit doar la repornire).
function handleInput(dir) {
  ensureAudio();
  if (state.over) {
    if (performance.now() - state.overAt < CONFIG.restartDelayMs) return; // evită repornirea accidentală
    resetGame();
    if (dir) queueDir(dir); // prima direcție pornește imediat runda nouă
    return;
  }
  if (!dir) return;
  queueDir(dir);
}

function queueDir(dir) {
  if (!state.running) {
    // pornire: nu lăsăm șarpele să meargă direct în propriul corp (stânga la start)
    if (dir.x === -state.dir.x && dir.y === -state.dir.y) return;
    state.running = true;
    state.lastTick = performance.now();
    elHint.textContent = '';
  }
  // păstrăm cel mult 2 direcții în coadă, ca să nu se acumuleze întârziere
  if (state.dirQueue.length < 2) state.dirQueue.push(dir);
}

document.addEventListener('keydown', (e) => {
  const d = KEYS[e.key] || null;
  if (d || state.over) {
    if (d) e.preventDefault();
    handleInput(d);
  }
});

// Swipe: pointer events acoperă și touch și mouse
let swipeStart = null;
document.addEventListener('pointerdown', (e) => {
  if (e.target === elMute || e.target === elAgain) return;
  swipeStart = { x: e.clientX, y: e.clientY, t: performance.now() };
});
document.addEventListener('pointerup', (e) => {
  if (e.target === elMute || e.target === elAgain) return;
  if (!swipeStart) return;
  const dx = e.clientX - swipeStart.x;
  const dy = e.clientY - swipeStart.y;
  swipeStart = null;
  let dir = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) >= CONFIG.swipeMinPx) {
    dir = Math.abs(dx) > Math.abs(dy) ? { x: Math.sign(dx), y: 0 } : { x: 0, y: Math.sign(dy) };
  }
  handleInput(dir); // tap simplu (dir null) repornește după pierdere
});
document.addEventListener('pointercancel', () => { swipeStart = null; });

elAgain.addEventListener('click', (e) => { e.stopPropagation(); handleInput(null); });

elMute.addEventListener('click', (e) => {
  e.stopPropagation();
  state.muted = !state.muted;
  elMute.classList.toggle('off', state.muted);
  try { localStorage.setItem(CONFIG.storageKey + '-mute', state.muted ? '1' : '0'); } catch (err) { /* ignorat */ }
  elMute.blur();
});

/* ============================================================
   DESENARE: canvas scalat la ecran, grilă, șarpe, mâncare
   ============================================================ */
let cell = 0;   // mărimea unei celule în pixeli reali (după devicePixelRatio)

function resize() {
  const wrap = document.getElementById('wrap');
  const cssSize = Math.floor(wrap.clientWidth);
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const px = Math.floor(cssSize * dpr);
  cell = Math.floor(px / CONFIG.grid);
  canvas.width = cell * CONFIG.grid;
  canvas.height = cell * CONFIG.grid;
}
window.addEventListener('resize', resize);

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function lerpColor(a, b, t) {
  const pa = [parseInt(a.slice(1, 3), 16), parseInt(a.slice(3, 5), 16), parseInt(a.slice(5, 7), 16)];
  const pb = [parseInt(b.slice(1, 3), 16), parseInt(b.slice(3, 5), 16), parseInt(b.slice(5, 7), 16)];
  const c = pa.map((v, i) => Math.round(v + (pb[i] - v) * t));
  return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
}

function draw(now) {
  const C = CONFIG.colors;
  const W = canvas.width;

  // hârtie
  ctx.fillStyle = C.paper;
  ctx.fillRect(0, 0, W, W);

  // grilă discretă, ca un caiet cu pătrățele
  ctx.strokeStyle = C.gridLine;
  ctx.lineWidth = Math.max(1, cell * 0.04);
  ctx.beginPath();
  for (let i = 1; i < CONFIG.grid; i++) {
    ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, W);
    ctx.moveTo(0, i * cell); ctx.lineTo(W, i * cell);
  }
  ctx.stroke();

  // puls: la mâncare șarpele se umflă scurt
  const pulseT = Math.max(0, (state.pulseUntil - now) / CONFIG.pulseMs); // 1 -> 0
  const swell = pulseT > 0 ? Math.sin(pulseT * Math.PI) * 0.12 : 0;

  // sigiliu de ceară (mâncarea)
  if (state.food.x >= 0) {
    const fx = (state.food.x + 0.5) * cell, fy = (state.food.y + 0.5) * cell;
    const r = cell * 0.36;
    ctx.fillStyle = C.food;
    ctx.beginPath(); ctx.arc(fx, fy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = C.foodHighlight;
    ctx.beginPath(); ctx.arc(fx - r * 0.3, fy - r * 0.3, r * 0.3, 0, Math.PI * 2); ctx.fill();
  }

  // corpul: de la coadă spre cap, culoarea se închide spre cap
  const n = state.snake.length;
  for (let i = n - 1; i >= 1; i--) {
    const s = state.snake[i];
    const t = n > 1 ? i / (n - 1) : 0;         // 0 la cap, 1 la coadă
    const inset = cell * (0.08 + t * 0.06 - swell);
    const size = cell - inset * 2;
    ctx.fillStyle = lerpColor(C.body, C.bodyTail, t);
    roundRect(s.x * cell + inset, s.y * cell + inset, size, size, size * 0.35);
    ctx.fill();
  }

  // capul: mai închis, mai mare, cu doi ochi
  const h = state.snake[0];
  const hin = cell * (0.04 - swell);
  const hs = cell - hin * 2;
  ctx.fillStyle = C.head;
  roundRect(h.x * cell + hin, h.y * cell + hin, hs, hs, hs * 0.45);
  ctx.fill();
  // ochii, poziționați după direcție
  const d = state.dir;
  const cx = (h.x + 0.5) * cell, cy = (h.y + 0.5) * cell;
  const off = cell * 0.18, side = cell * 0.17, er = cell * 0.07;
  const ex1 = cx + d.x * off + d.y * side, ey1 = cy + d.y * off - d.x * side;
  const ex2 = cx + d.x * off - d.y * side, ey2 = cy + d.y * off + d.x * side;
  ctx.fillStyle = C.eye;
  ctx.beginPath(); ctx.arc(ex1, ey1, er, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(ex2, ey2, er, 0, Math.PI * 2); ctx.fill();
}

/* ============================================================
   BUCLA: requestAnimationFrame pentru desen, ticuri fixe pentru mișcare
   ============================================================ */
function loop(now) {
  if (state.running) {
    let elapsed = now - state.lastTick;
    // dacă tab-ul a stat în fundal, nu rulăm zeci de ticuri deodată
    if (elapsed > state.tickMs * 4) { elapsed = state.tickMs; state.lastTick = now - elapsed; }
    while (elapsed >= state.tickMs && state.running) {
      tick();
      elapsed -= state.tickMs;
      state.lastTick += state.tickMs;
    }
  }
  draw(now);
  requestAnimationFrame(loop);
}

/* ============================================================
   PORNIRE
   ============================================================ */
state.best = loadBest();
state.muted = loadMuted();
elMute.classList.toggle('off', state.muted);
resize();
resetGame();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
